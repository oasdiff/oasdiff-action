name: breaking
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  oasdiff_breaking:
    runs-on: ubuntu-latest
    name: Test breaking changes
    env:
      OASDIFF_ACTION_TEST_EXPECTED_OUTPUT: "1 changes: 1 error, 0 warning, 0 info"
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Running breaking action
        id: test_breaking_changes
        uses: ./breaking
        with:
          base: 'specs/base.yaml'
          revision: 'specs/revision-breaking.yaml'
          output-to-file: 'breaking.txt'
      - name: Test breaking changes action output
        env:
          ACTUAL_OUTPUT: ${{ steps.test_breaking_changes.outputs.breaking }}
        run: |
          output="$ACTUAL_OUTPUT"
          if [ "$output" != "$OASDIFF_ACTION_TEST_EXPECTED_OUTPUT" ]; then
            echo "Expected output '$OASDIFF_ACTION_TEST_EXPECTED_OUTPUT' but got '$output'" >&2
            exit 1
          fi
      - name: Test breaking changes action output to file
        run: |
          if [ ! -s breaking.txt ]; then
            echo "Breaking changes file doesn't exist or is empty"
            exit 1
          fi
          output=$(cat breaking.txt | head -n 1)
          if [[  "${output}" != "$OASDIFF_ACTION_TEST_EXPECTED_OUTPUT" ]]; then
            echo "Expected output '$OASDIFF_ACTION_TEST_EXPECTED_OUTPUT' but got '${output}'" >&2
            exit 1
          fi
  oasdiff_breaking_fail_on:
    runs-on: ubuntu-latest
    name: Test fail on breaking changes
    env:
      OASDIFF_ACTION_TEST_EXPECTED_OUTPUT: "1 changes: 0 error, 1 warning, 0 info"
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Running breaking action
        id: test_breaking_changes
        uses: ./breaking
        with:
          base: 'specs/base.yaml'
          revision: 'specs/revision-breaking-warn.yaml'
          output-to-file: 'breaking.txt'
          fail-on: 'ERR'
      - name: Test breaking changes action output
        env:
          ACTUAL_OUTPUT: ${{ steps.test_breaking_changes.outputs.breaking }}
        run: |
          output="$ACTUAL_OUTPUT"
          if [ "$output" != "$OASDIFF_ACTION_TEST_EXPECTED_OUTPUT" ]; then
            echo "Expected output '$OASDIFF_ACTION_TEST_EXPECTED_OUTPUT' but got '$output'" >&2
            exit 1
          fi
      - name: Test breaking changes action output to file
        run: |
          if [ ! -s breaking.txt ]; then
            echo "Breaking changes file doesn't exist or is empty"
            exit 1
          fi
          output=$(cat breaking.txt | head -n 1)
          if [[  "${output}" != "$OASDIFF_ACTION_TEST_EXPECTED_OUTPUT" ]]; then
            echo "Expected output '$OASDIFF_ACTION_TEST_EXPECTED_OUTPUT' but got '${output}'" >&2
            exit 1
          fi
  oasdiff_breaking_matching_delimiter_not_found:
      runs-on: ubuntu-latest
      name: Test breaking action with petsotre to validate no error of unable to process file command 'output' successfully and invalid value and matching delimiter not found
      env:
        OASDIFF_ACTION_TEST_EXPECTED_OUTPUT: "7 changes: 6 error, 1 warning, 0 info"
      steps:
        - name: checkout
          uses: actions/checkout@v7
        - name: Running breaking action with petsotre to validate no error of unable to process file command 'output' successfully and invalid value and matching delimiter not found
          id: test_breaking_changes_matching_delimiter_not_found
          uses: ./breaking
          with:
            base: 'specs/petstore-base.yaml'
            revision: 'specs/petstore-revision.yaml'
        - name: Test breaking changes action output
          env:
            ACTUAL_OUTPUT: ${{ steps.test_breaking_changes_matching_delimiter_not_found.outputs.breaking }}
          run: |
            output="$ACTUAL_OUTPUT"
            if [ "$output" != "$OASDIFF_ACTION_TEST_EXPECTED_OUTPUT" ]; then
              echo "Expected output '$OASDIFF_ACTION_TEST_EXPECTED_OUTPUT' but got '$output'" >&2
              exit 1
            fi
  oasdiff_breaking_composed:
    runs-on: ubuntu-latest
    name: Test breaking action with composed option
    env:
        OASDIFF_ACTION_TEST_EXPECTED_OUTPUT: "1 changes: 1 error, 0 warning, 0 info"
    steps:
        - name: checkout
          uses: actions/checkout@v7
        - name: Running breaking action with composed option
          id: test_breaking_composed
          uses: ./breaking
          with:
            base: 'specs/glob/base/*.yaml'
            revision: 'specs/glob/revision/*.yaml'
            composed: true
        - name: Test breaking action output
          env:
            ACTUAL_OUTPUT: ${{ steps.test_breaking_composed.outputs.breaking }}
          run: |
            output="$ACTUAL_OUTPUT"
            if [[ "$output" != *"$OASDIFF_ACTION_TEST_EXPECTED_OUTPUT"* ]]; then
              echo "Expected '$OASDIFF_ACTION_TEST_EXPECTED_OUTPUT', instead got '$output'" >&2
              exit 1
            fi
  oasdiff_breaking_deprecation:
    runs-on: ubuntu-latest
    name: Test breaking changes with deprecation
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Set date for deprecated specs
        run: |
          # Deprecate Beta in 14 days
          sed -ie "s/{{SUNSET_DATE_BETA}}/$(date --date="14 day" "+%Y-%m-%d")/" specs/base-deprecation.yaml
          # Deprecate Stable in 21 days
          sed -ie "s/{{SUNSET_DATE_STABLE}}/$(date --date="21 day" "+%Y-%m-%d")/" specs/base-deprecation.yaml
      - name: Running OpenAPI Spec check breaking action
        id: test_breaking_deprecations
        uses: ./breaking
        with:
          base: specs/base.yaml
          revision: specs/base-deprecation.yaml
          deprecation-days-beta: 14
          deprecation-days-stable: 21
  oasdiff_breaking_flatten_allof:
    runs-on: ubuntu-latest
    name: Test breaking action with flatten-allof option
    env:
      OASDIFF_ACTION_TEST_EXPECTED_OUTPUT: "1 changes: 1 error, 0 warning, 0 info"
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Running breaking action with flatten-allof option
        id: test_breaking_flatten_allof
        uses: ./breaking
        with:
          base: 'specs/base-allof.yaml'
          revision: 'specs/revision-allof.yaml'
          flatten-allof: true
      - name: Test breaking action output
        env:
          ACTUAL_OUTPUT: ${{ steps.test_breaking_flatten_allof.outputs.breaking }}
        run: |
          output="$ACTUAL_OUTPUT"
          if [ "$output" != "$OASDIFF_ACTION_TEST_EXPECTED_OUTPUT" ]; then
            echo "Expected output '$OASDIFF_ACTION_TEST_EXPECTED_OUTPUT' but got '$output'" >&2
            exit 1
          fi
  oasdiff_breaking_err_ignore:
    runs-on: ubuntu-latest
    name: Test breaking action with err-ignore option
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Running breaking action with err-ignore option
        id: test_breaking_err_ignore
        uses: ./breaking
        with:
          base: 'specs/base.yaml'
          revision: 'specs/revision-breaking.yaml'
          err-ignore: 'specs/err-ignore.txt'
      - name: Test breaking changes are suppressed
        env:
          ACTUAL_OUTPUT: ${{ steps.test_breaking_err_ignore.outputs.breaking }}
        run: |
          output="$ACTUAL_OUTPUT"
          if [ "$output" != "No breaking changes" ]; then
            echo "Expected 'No breaking changes' but got '$output'" >&2
            exit 1
          fi

  # ---------------------------------------------------------------------
  # .oasdiff.yaml config-file support — verify all three free actions
  # pick up .oasdiff.yaml from the repo root automatically (via the CLI's
  # cwd-based config-file lookup; the runner mounts $GITHUB_WORKSPACE as
  # the container's WORKDIR).
  # ---------------------------------------------------------------------

  oasdiff_breaking_yaml_config_fail_on:
    runs-on: ubuntu-latest
    name: Test breaking action picks up fail-on from .oasdiff.yaml
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Drop .oasdiff.yaml at repo root
        run: |
          cat > .oasdiff.yaml <<EOF
          fail-on: ERR
          EOF
      - name: Running breaking action without fail-on input
        id: test_yaml_fail_on
        continue-on-error: true
        uses: ./breaking
        with:
          base: 'specs/base.yaml'
          revision: 'specs/revision-breaking.yaml'
      - name: Assert action failed (.oasdiff.yaml fail-on triggered) and report rendered
        env:
          ACTUAL_OUTPUT: ${{ steps.test_yaml_fail_on.outputs.breaking }}
        run: |
          if [ "${{ steps.test_yaml_fail_on.outcome }}" != "failure" ]; then
            echo "Expected action to fail because .oasdiff.yaml sets fail-on: ERR and the spec has an ERR-level breaking change. Got outcome: ${{ steps.test_yaml_fail_on.outcome }}" >&2
            exit 1
          fi
          output="$ACTUAL_OUTPUT"
          # Even when fail-on triggers, the entrypoint should still render
          # the report. Check that the breaking output is non-empty and
          # matches the same shape as a normal fail-on-input run.
          if [ "$output" != "1 changes: 1 error, 0 warning, 0 info" ]; then
            echo "Expected '1 changes: 1 error, 0 warning, 0 info' to be rendered alongside fail-on, got: '$output'" >&2
            exit 1
          fi

  oasdiff_breaking_yaml_config_err_ignore:
    runs-on: ubuntu-latest
    name: Test breaking action picks up err-ignore from .oasdiff.yaml
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Drop .oasdiff.yaml at repo root
        run: |
          cat > .oasdiff.yaml <<EOF
          err-ignore: specs/err-ignore.txt
          EOF
      - name: Running breaking action without err-ignore input
        id: test_yaml_err_ignore
        uses: ./breaking
        with:
          base: 'specs/base.yaml'
          revision: 'specs/revision-breaking.yaml'
      - name: Assert breaking changes were suppressed by .oasdiff.yaml
        env:
          ACTUAL_OUTPUT: ${{ steps.test_yaml_err_ignore.outputs.breaking }}
        run: |
          output="$ACTUAL_OUTPUT"
          if [ "$output" != "No breaking changes" ]; then
            echo "Expected 'No breaking changes' (err-ignore from .oasdiff.yaml should suppress findings) but got '$output'" >&2
            exit 1
          fi

  oasdiff_breaking_yaml_config_severity_levels:
    runs-on: ubuntu-latest
    name: Test breaking action picks up severity-levels from .oasdiff.yaml
    steps:
      - name: checkout
        uses: actions/checkout@v7
      # specs/severity-levels.txt downgrades api-removed-without-deprecation to
      # info, so the one breaking change these specs produce stops being an
      # error and fail-on: ERR no longer fails the step.
      - name: Drop .oasdiff.yaml at repo root
        run: |
          cat > .oasdiff.yaml <<EOF
          severity-levels: specs/severity-levels.txt
          fail-on: ERR
          EOF
      - name: Running breaking action
        id: test_yaml_severity_levels
        uses: ./breaking
        with:
          base: 'specs/base.yaml'
          revision: 'specs/revision-breaking.yaml'
      - name: Assert the finding was downgraded by .oasdiff.yaml
        env:
          ACTUAL_OUTPUT: ${{ steps.test_yaml_severity_levels.outputs.breaking }}
        run: |
          output="$ACTUAL_OUTPUT"
          if [ "$output" != "No breaking changes" ]; then
            echo "Expected 'No breaking changes' (severity-levels from .oasdiff.yaml should downgrade the finding to info) but got '$output'" >&2
            exit 1
          fi

  oasdiff_breaking_include_checks_deprecated:
    runs-on: ubuntu-latest
    name: Test include-checks is warned about, not applied
    env:
      OASDIFF_ACTION_TEST_EXPECTED_OUTPUT: "1 changes: 1 error, 0 warning, 0 info"
    steps:
      - name: checkout
        uses: actions/checkout@v7
      # include-checks is ignored by oasdiff. The action must not pass it on and
      # must not change the result; it only warns. Passing a name that is not a
      # real check would fail the run if the action still forwarded it.
      - name: Running breaking action with include-checks
        id: test_include_checks
        continue-on-error: true
        uses: ./breaking
        with:
          base: 'specs/base.yaml'
          revision: 'specs/revision-breaking.yaml'
          include-checks: 'not-a-real-check'
      - name: Assert the run was unaffected
        env:
          ACTUAL_OUTPUT: ${{ steps.test_include_checks.outputs.breaking }}
        run: |
          output="$ACTUAL_OUTPUT"
          if [ "$output" != "$OASDIFF_ACTION_TEST_EXPECTED_OUTPUT" ]; then
            echo "Expected output '$OASDIFF_ACTION_TEST_EXPECTED_OUTPUT' (include-checks must be ignored, not forwarded) but got '$output'" >&2
            exit 1
          fi

  oasdiff_breaking_unresolved_ref:
    runs-on: ubuntu-latest
    name: Test a failed comparison is not reported as clean
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Run breaking action against a spec that cannot be loaded
        id: test_unresolved_ref
        continue-on-error: true
        uses: ./breaking
        with:
          base: 'specs/unresolved-ref.yaml'
          revision: 'specs/unresolved-ref.yaml'
          review: false
      - name: Assert the step failed and reported no clean result
        run: |
          if [ "${{ steps.test_unresolved_ref.outcome }}" != "failure" ]; then
            echo "Expected the action to fail when the spec cannot be loaded" >&2
            exit 1
          fi
          case "${{ steps.test_unresolved_ref.outputs.breaking }}" in
            *"No breaking changes"*)
              echo "A failed comparison must never be reported as 'No breaking changes'" >&2
              exit 1
              ;;
          esac

  oasdiff_breaking_comment_lists_the_changes:
    runs-on: ubuntu-latest
    name: Test the PR comment lists the changes
    # The comment is what a reviewer reads on the pull request, so it carries
    # the changes themselves, capped so a large changelog cannot exceed
    # GitHub's 65,536-character comment limit. Stubs oasdiff (a 7-change json
    # render) and curl (captures the comment body), so the assertions read the
    # exact body the action would post.
    steps:
      - uses: actions/checkout@v7
      - name: Stub oasdiff + curl and run the entrypoint
        run: |
          set -euo pipefail
          mkdir -p /tmp/stub /tmp/run

          cat > /tmp/stub/oasdiff <<'STUB'
          #!/bin/sh
          for a in "$@"; do
            case "$a" in
              json) fmt=json ;;
              githubactions) fmt=gha ;;
              --open) fmt=open ;;
            esac
          done
          case "${fmt:-text}" in
            json)
              printf '['
              i=1
              while [ "$i" -le 7 ]; do
                [ "$i" -gt 1 ] && printf ','
                printf '{"id":"api-removed-without-deprecation","text":"API removed","level":3,"operation":"GET","path":"/pets%s","section":"paths"}' "$i"
                i=$((i+1))
              done
              printf ']'
              ;;
            gha) echo "::error file=specs/base.yaml,line=11::API removed" ;;
            open) echo "https://www.oasdiff.com/review/e/stub-id#k=stub-key" >&2 ;;
            *) echo "7 changes: 7 error, 0 warning, 0 info" ;;
          esac
          STUB
          chmod +x /tmp/stub/oasdiff

          cat > /tmp/stub/curl <<'STUB'
          #!/bin/sh
          for a in "$@"; do
            case "$prev" in -X) method=$a ;; esac
            prev=$a
          done
          case " $* " in
            *api/telemetry*) cat > /tmp/run/telemetry.json; exit 0 ;;
          esac
          if [ "${method:-GET}" = GET ]; then echo '[]'; exit 0; fi
          cat > /tmp/run/comment.json
          printf '201'
          STUB
          chmod +x /tmp/stub/curl

          export GITHUB_REF=refs/pull/7/merge
          export GITHUB_REPOSITORY=acme/api
          export GITHUB_OUTPUT=/tmp/run/output
          export GITHUB_STEP_SUMMARY=/tmp/run/summary
          export GITHUB_ACTION_REF=v0
          printf '{"pull_request":{"head":{"repo":{"full_name":"acme/api"}}}}' > /tmp/run/event.json
          export GITHUB_EVENT_PATH=/tmp/run/event.json
          # jq stays the system jq; only oasdiff and curl are stubbed.
          export PATH=/tmp/stub:$PATH

          ./breaking/entrypoint.sh 'specs/base.yaml' 'specs/revision-breaking.yaml' \
            '' '' 'false' '' '' '' '' 'false' 'false' '' '' '' 'false' 'true' 'fake-token'

          if [ ! -f /tmp/run/comment.json ]; then
            echo "FAIL: no comment was posted" >&2
            exit 1
          fi
          body=$(jq -r '.body' < /tmp/run/comment.json)
          echo "--- comment body ---"
          echo "$body"
          for expected in \
            '7 breaking changes in this pull request' \
            '| severity | change | endpoint |' \
            'api-removed-without-deprecation' \
            'GET /pets5' \
            '<details><summary>2 more</summary>' \
            'GET /pets6' \
            'oasdiff Pro'
          do
            case "$body" in
              *"$expected"*) ;;
              *) echo "FAIL: the comment is missing: $expected" >&2; exit 1 ;;
            esac
          done
          # Five rows stay open and the rest collapse, so the 6th change is
          # listed but only inside the details block.
          open_rows=$(printf '%s' "$body" | sed -n '1,/<details>/p' | grep -c '^| error ')
          if [ "$open_rows" -ne 5 ]; then
            echo "FAIL: expected 5 rows above the collapsed block, got $open_rows" >&2
            exit 1
          fi
          mode=$(jq -r '.props.mode' < /tmp/run/telemetry.json)
          if [ "$mode" != "comment" ]; then
            echo "FAIL: expected delivery mode 'comment', got '$mode'" >&2
            exit 1
          fi
          echo "PASS"

  oasdiff_breaking_comment_failure_names_the_fix:
    runs-on: ubuntu-latest
    name: Test a blocked PR comment says what to change
    # A comment that cannot post is reported two different ways, because only
    # one of them is actionable: a job without pull-requests:write gets a
    # warning naming the permission, while a pull request from a fork gets a
    # plain line, since GitHub makes the token read-only there whatever the
    # job does. Both cases are also reported separately in the delivery mode.
    steps:
      - uses: actions/checkout@v7
      - name: Stub oasdiff + a rejecting curl, run with and without a fork event
        run: |
          set -euo pipefail
          mkdir -p /tmp/stub /tmp/run

          cat > /tmp/stub/oasdiff <<'STUB'
          #!/bin/sh
          for a in "$@"; do
            case "$a" in
              json) fmt=json ;;
              githubactions) fmt=gha ;;
              --open) fmt=open ;;
            esac
          done
          case "${fmt:-text}" in
            json) printf '[{"id":"api-removed-without-deprecation","text":"API removed","level":3,"operation":"GET","path":"/pets","section":"paths"}]' ;;
            gha) echo "::error file=specs/base.yaml,line=11::API removed" ;;
            open) echo "https://www.oasdiff.com/review/e/stub-id#k=stub-key" >&2 ;;
            *) echo "1 changes: 1 error, 0 warning, 0 info" ;;
          esac
          STUB
          chmod +x /tmp/stub/oasdiff

          # Rejects the comment with 403, the shape GitHub returns both for a
          # missing permission and for a fork's read-only token.
          cat > /tmp/stub/curl <<'STUB'
          #!/bin/sh
          for a in "$@"; do
            case "$prev" in -X) method=$a ;; esac
            prev=$a
          done
          case " $* " in
            *api/telemetry*) cat > /tmp/run/telemetry.json; exit 0 ;;
          esac
          if [ "${method:-GET}" = GET ]; then echo '[]'; exit 0; fi
          cat > /dev/null
          printf '403'
          STUB
          chmod +x /tmp/stub/curl

          export GITHUB_REF=refs/pull/7/merge
          export GITHUB_REPOSITORY=acme/api
          export GITHUB_OUTPUT=/tmp/run/output
          export GITHUB_STEP_SUMMARY=/tmp/run/summary
          export GITHUB_ACTION_REF=v0
          export GITHUB_EVENT_PATH=/tmp/run/event.json
          export PATH=/tmp/stub:$PATH

          run_entrypoint () {
            ./breaking/entrypoint.sh 'specs/base.yaml' 'specs/revision-breaking.yaml' \
              '' '' 'false' '' '' '' '' 'false' 'false' '' '' '' 'false' 'true' 'fake-token'
          }

          echo "=== same-repo pull request: expect a warning naming the permission"
          printf '{"pull_request":{"head":{"repo":{"full_name":"acme/api"}}}}' > /tmp/run/event.json
          out=$(run_entrypoint 2>&1)
          echo "$out" | grep -v '^flags:\|^running oasdiff'
          case "$out" in
            *"::warning::oasdiff: couldn't post the review link"*"pull-requests: write"*) ;;
            *) echo "FAIL: no warning naming the permission" >&2; exit 1 ;;
          esac
          mode=$(jq -r '.props.mode' < /tmp/run/telemetry.json)
          if [ "$mode" != "comment_failed" ]; then
            echo "FAIL: expected delivery mode 'comment_failed', got '$mode'" >&2
            exit 1
          fi

          echo "=== fork pull request: expect a plain line and no warning"
          printf '{"pull_request":{"head":{"repo":{"full_name":"contrib/api-fork"}}}}' > /tmp/run/event.json
          out=$(run_entrypoint 2>&1)
          echo "$out" | grep -v '^flags:\|^running oasdiff'
          case "$out" in
            *"comes from a fork"*) ;;
            *) echo "FAIL: a fork pull request was not reported as one" >&2; exit 1 ;;
          esac
          case "$out" in
            *"::warning::oasdiff: couldn't post the review link"*)
              echo "FAIL: a fork pull request must not warn about a permission it cannot have" >&2
              exit 1
              ;;
          esac
          mode=$(jq -r '.props.mode' < /tmp/run/telemetry.json)
          if [ "$mode" != "comment_fork" ]; then
            echo "FAIL: expected delivery mode 'comment_fork', got '$mode'" >&2
            exit 1
          fi
          echo "PASS"
