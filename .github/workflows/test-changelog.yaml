name: changelog
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  oasdiff_changelog:
    runs-on: ubuntu-latest
    name: Test generation of changelog
    env:
      OASDIFF_ACTION_TEST_EXPECTED_OUTPUT: "26 changes: 4 error, 4 warning, 18 info"
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Running changelog action
        id: test_changelog
        uses: ./changelog
        with:
          base: https://raw.githubusercontent.com/oasdiff/oasdiff/main/data/openapi-test1.yaml
          revision: https://raw.githubusercontent.com/oasdiff/oasdiff/main/data/openapi-test3.yaml
          output-to-file: "changelog.txt"
      - name: Test changelog action output
        run: |
          output=$(echo "${{steps.test_changelog.outputs.changelog}}" | head -n 1)
          if [[  "${output}" != "${OASDIFF_ACTION_TEST_EXPECTED_OUTPUT}" ]]; then
            echo "Expected output '$OASDIFF_ACTION_TEST_EXPECTED_OUTPUT' but got '${output}'" >&2
            exit 1
          fi
      - name: Test changelog action output to file
        run: |
          if [ ! -s changelog.txt ]; then
            echo "Changelog file doesn't exist or is empty"
            exit 1
          fi
          output=$(cat changelog.txt | head -n 1)
          if [[  "${output}" != "${OASDIFF_ACTION_TEST_EXPECTED_OUTPUT}" ]]; then
            echo "Expected output '$OASDIFF_ACTION_TEST_EXPECTED_OUTPUT' but got '${output}'" >&2
            exit 1
          fi
  oasdiff_changelog_composed:
    runs-on: ubuntu-latest
    name: Test changelog action with composed option
    steps:
        - name: checkout
          uses: actions/checkout@v7
        - name: Running changelog action with composed option
          id: test_changelog_composed
          uses: ./changelog
          with:
            base: 'specs/glob/base/*.yaml'
            revision: 'specs/glob/revision/*.yaml'
            composed: true
        - name: Test changelog action output
          env:
            ACTUAL_OUTPUT: ${{ steps.test_changelog_composed.outputs.changelog }}
          run: |
            output="$ACTUAL_OUTPUT"
            if [[ "$output" != *"1 changes: 1 error, 0 warning, 0 info"* ]]; then
              echo "Expected '1 changes: 1 error, 0 warning, 0 info', instead got '$output'" >&2
              exit 1
            fi
  oasdiff_changelog_yaml_config_level:
    runs-on: ubuntu-latest
    name: Test changelog action picks up level from .oasdiff.yaml
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Drop .oasdiff.yaml at repo root
        run: |
          cat > .oasdiff.yaml <<EOF
          level: ERR
          EOF
      - name: Running changelog action without level input
        id: test_yaml_level
        uses: ./changelog
        with:
          base: https://raw.githubusercontent.com/oasdiff/oasdiff/main/data/openapi-test1.yaml
          revision: https://raw.githubusercontent.com/oasdiff/oasdiff/main/data/openapi-test3.yaml
      - name: Assert level filter from .oasdiff.yaml suppressed warning/info findings
        run: |
          # Without the YAML, the same specs produce "26 changes: 4 error, 4 warning, 18 info".
          # With level: ERR in YAML, only the 4 errors should remain.
          output=$(echo "${{ steps.test_yaml_level.outputs.changelog }}" | head -n 1)
          if [[ "$output" != "4 changes: 4 error, 0 warning, 0 info" ]]; then
            echo "Expected '4 changes: 4 error, 0 warning, 0 info' (level: ERR from .oasdiff.yaml) but got '$output'" >&2
            exit 1
          fi
  changelog_pro_expired_trial_warns_without_failing:
    runs-on: ubuntu-latest
    name: Test changelog Pro path surfaces an expired-trial 402 without failing
    # When the tenant's trial/subscription has lapsed, the authenticated --open
    # upload returns HTTP 402 subscription_expired, which the CLI surfaces as
    # "upload failed (HTTP 402): {...}". The Pro path should show a graceful
    # "trial expired" warning + step summary and NOT fail the job, instead of
    # the generic "verify the oasdiff-token" warning (misleading: the token is
    # fine, the plan lapsed).
    steps:
      - uses: actions/checkout@v7
      - name: Stub oasdiff (402 subscription_expired on --open), run entrypoint
        run: |
          set -euo pipefail
          mkdir -p /tmp/stub /tmp/run

          # The entrypoint invokes oasdiff three times: the json render (its
          # length says whether there are changes, and feeds the PR comment),
          # the user-facing render, and the authenticated --open upload. Branch
          # on the args.
          cat > /tmp/stub/oasdiff <<'STUB'
          #!/bin/sh
          for a in "$@"; do [ "$a" = "json" ] && { printf '[{"id":"api-removed-without-deprecation","text":"API removed","level":3,"operation":"GET","path":"/pets","section":"paths","fingerprint":"abc123def456"}]'; exit 0; }; done
          for a in "$@"; do
            if [ "$a" = "--open" ]; then
              echo 'Error: upload failed (HTTP 402): {"code":"subscription_expired","message":"Your oasdiff trial or subscription has expired. Renew at https://www.oasdiff.com/pricing to continue using oasdiff Pro.","upgrade_url":"https://www.oasdiff.com/pricing"}' >&2
              exit 1
            fi
          done
          echo "1 changes: 1 error, 0 warning, 0 info"
          STUB
          chmod +x /tmp/stub/oasdiff

          export GITHUB_REF=refs/pull/123/merge
          export GITHUB_REPOSITORY=acme/widgets
          export GITHUB_SHA=deadbeef
          export GITHUB_OUTPUT=/tmp/run/gh-output; : > "$GITHUB_OUTPUT"
          export GITHUB_STEP_SUMMARY=/tmp/run/step-summary; : > "$GITHUB_STEP_SUMMARY"
          cat > /tmp/run/event.json <<EVT
          {"pull_request":{"head":{"sha":"deadbeef"},"base":{"sha":"baadcafe"}}}
          EVT
          export GITHUB_EVENT_PATH=/tmp/run/event.json

          export PATH=/tmp/stub:$PATH
          set +e
          out=$(env OASDIFF_ACTION_COMMAND=changelog INPUT_BASE=b INPUT_REVISION=r \
            'INPUT_OASDIFF-TOKEN=stub-oasdiff-token' bash ./breaking/entrypoint.sh 2>&1)
          rc=$?
          set -e
          echo "--- entrypoint output ---"; echo "$out"
          echo "--- exit code: $rc ---"
          echo "--- step summary ---"; cat "$GITHUB_STEP_SUMMARY"

          if [ "$rc" -ne 0 ]; then
            echo "FAIL: expected exit 0 (warn-don't-fail), got $rc" >&2
            exit 1
          fi
          if ! echo "$out" | grep -q "::warning title=oasdiff trial or subscription expired::"; then
            echo "FAIL: missing expired-trial warning annotation" >&2
            exit 1
          fi
          if ! grep -q "oasdiff trial or subscription expired" "$GITHUB_STEP_SUMMARY"; then
            echo "FAIL: expired-trial step summary not written" >&2
            exit 1
          fi
          if echo "$out" | grep -q "verify the oasdiff-token"; then
            echo "FAIL: fell through to the generic upload-failed warning" >&2
            exit 1
          fi
          echo "PASS"
  changelog_pro_happy_path_posts_comment_and_status:
    runs-on: ubuntu-latest
    name: Test changelog Pro path posts the review comment and sets the gate
    # Companion to changelog_pro_expired_trial_warns_without_failing: the success
    # path. Stubs oasdiff (one change in the json render; --open prints a /review/ep URL +
    # "review status: pending") and curl (GitHub API: empty comment list, then
    # 2xx for the comment + status POSTs). Asserts the Pro review comment is
    # posted, the oasdiff commit status is set, and the review URL reaches the
    # step summary. Guards the core Pro funnel action behavior in CI without the
    # full prod e2e.
    steps:
      - uses: actions/checkout@v7
      - name: Stub oasdiff + curl (Pro success), run entrypoint
        run: |
          set -euo pipefail
          mkdir -p /tmp/stub /tmp/run

          cat > /tmp/stub/oasdiff <<'STUB'
          #!/bin/sh
          for a in "$@"; do [ "$a" = "json" ] && { printf '[{"id":"api-removed-without-deprecation","text":"API removed","level":3,"operation":"GET","path":"/pets","section":"paths","fingerprint":"abc123def456"}]'; exit 0; }; done
          for a in "$@"; do
            if [ "$a" = "--open" ]; then
              echo "oasdiff: opening review at https://www.oasdiff.com/review/ep/test-token-uuid#k=test-key" >&2
              echo "oasdiff: review status: pending" >&2
              exit 0
            fi
          done
          echo "1 changes: 1 error, 0 warning, 0 info"
          STUB
          chmod +x /tmp/stub/oasdiff

          # The POST calls carry -w %{http_code}; return a 2xx, keeping the
          # comment body so the assertions can read it. The comment-list GET has
          # no such flag; return an empty JSON array so jq finds no existing
          # comment and the entrypoint POSTs a new one.
          cat > /tmp/stub/curl <<'STUB'
          #!/bin/sh
          for a in "$@"; do
            case "$a" in *"%{http_code}"*) http_code=1 ;; esac
            case "$a" in *"/issues/"*) comment=1 ;; esac
          done
          if [ -n "${http_code:-}" ]; then
            if [ -n "${comment:-}" ]; then cat > /tmp/run/pro-comment.json; else cat > /dev/null; fi
            echo "201"
            exit 0
          fi
          echo "[]"
          STUB
          chmod +x /tmp/stub/curl

          export GITHUB_REF=refs/pull/123/merge
          export GITHUB_REPOSITORY=acme/widgets
          export GITHUB_SHA=deadbeef
          export GITHUB_OUTPUT=/tmp/run/out; : > "$GITHUB_OUTPUT"
          export GITHUB_STEP_SUMMARY=/tmp/run/summary; : > "$GITHUB_STEP_SUMMARY"
          cat > /tmp/run/event.json <<EVT
          {"pull_request":{"head":{"sha":"deadbeef"},"base":{"sha":"baadcafe"}}}
          EVT
          export GITHUB_EVENT_PATH=/tmp/run/event.json

          export PATH=/tmp/stub:$PATH
          set +e
          out=$(env OASDIFF_ACTION_COMMAND=changelog INPUT_BASE=b INPUT_REVISION=r \
            'INPUT_GITHUB-TOKEN=gh-token' 'INPUT_OASDIFF-TOKEN=oasdiff-token' bash ./breaking/entrypoint.sh 2>&1)
          rc=$?
          set -e
          echo "--- output ---"; echo "$out"
          echo "--- step summary ---"; cat "$GITHUB_STEP_SUMMARY"

          if [ "$rc" -ne 0 ]; then echo "FAIL: expected exit 0, got $rc" >&2; exit 1; fi
          # The paid comment must carry at least what the free one does: the
          # changes themselves, plus the gate state only Pro has.
          if [ ! -f /tmp/run/pro-comment.json ]; then
            echo "FAIL: the Pro comment body was never posted" >&2; exit 1
          fi
          pro_body=$(jq -r '.body' < /tmp/run/pro-comment.json)
          echo "--- Pro comment body ---"
          echo "$pro_body"
          for expected in \
            '1 API change in this pull request' \
            'status check on this pull request shows whether they are all approved' \
            '| severity | change | endpoint | diff |' \
            'API removed' \
            'Review and approve the changes'
          do
            case "$pro_body" in
              *"$expected"*) ;;
              *) echo "FAIL: the Pro comment is missing: $expected" >&2; exit 1 ;;
            esac
          done
          if ! echo "$out" | grep -q "oasdiff: posted the Pro review comment."; then
            echo "FAIL: Pro review comment not posted" >&2; exit 1
          fi
          if ! echo "$out" | grep -q "set the 'oasdiff' commit status to 'pending'"; then
            echo "FAIL: commit status not set" >&2; exit 1
          fi
          if ! grep -q 'review/ep/test-token-uuid' "$GITHUB_STEP_SUMMARY"; then
            echo "FAIL: review URL not in step summary" >&2; exit 1
          fi
          echo "PASS"

  oasdiff_changelog_comment_lists_the_changes:
    runs-on: ubuntu-latest
    name: Test the PR comment lists the changes
    # Sibling of the breaking action's job of the same name: the two
    # entrypoints build the same comment, so a change to one that misses the
    # other fails here. Stubs oasdiff (a 6-change json render) and curl
    # (captures the comment body).
    steps:
      - uses: actions/checkout@v7
      - name: Stub oasdiff + curl and run the entrypoint
        run: |
          set -euo pipefail
          mkdir -p /tmp/stub /tmp/run

          cat > /tmp/stub/oasdiff <<'STUB'
          #!/bin/sh
          for a in "$@"; do
            case "$a" in
              json) fmt=json ;;
              githubactions) fmt=gha ;;
              --open) fmt=open ;;
            esac
          done
          case "${fmt:-text}" in
            json)
              printf '[{"id":"api-removed-without-deprecation","text":"API removed","level":3,"operation":"GET","path":"/pets","section":"paths"}'
              printf ',{"id":"response-property-became-optional","text":"added @octocat [l](https://e.example) <b>","level":1,"operation":"POST","path":"/pets","section":"paths"}'
              i=3
              while [ "$i" -le 6 ]; do
                printf ',{"id":"request-property-added","text":"added","level":1,"operation":"PUT","path":"/pets%s","section":"paths","fingerprint":"fp%s"}' "$i" "$i"
                i=$((i+1))
              done
              printf ']'
              ;;
            gha) echo "::error file=specs/base.yaml,line=11::API removed" ;;
            open) echo "https://www.oasdiff.com/review/e/stub-id#k=stub-key" >&2 ;;
            *) echo "6 changes: 1 error, 0 warning, 5 info" ;;
          esac
          STUB
          chmod +x /tmp/stub/oasdiff

          cat > /tmp/stub/curl <<'STUB'
          #!/bin/sh
          for a in "$@"; do
            case "$prev" in -X) method=$a ;; esac
            prev=$a
          done
          case " $* " in
            *api/telemetry*) cat > /tmp/run/telemetry.json; exit 0 ;;
          esac
          if [ "${method:-GET}" = GET ]; then echo '[]'; exit 0; fi
          cat > /tmp/run/comment.json
          printf '201'
          STUB
          chmod +x /tmp/stub/curl

          export GITHUB_REF=refs/pull/7/merge
          export GITHUB_REPOSITORY=acme/api
          export GITHUB_OUTPUT=/tmp/run/output
          export GITHUB_STEP_SUMMARY=/tmp/run/summary
          export GITHUB_ACTION_REF=v0
          printf '{"pull_request":{"head":{"repo":{"full_name":"acme/api"}}}}' > /tmp/run/event.json
          export GITHUB_EVENT_PATH=/tmp/run/event.json
          export PATH=/tmp/stub:$PATH

          env OASDIFF_ACTION_COMMAND=changelog \
            INPUT_BASE=specs/base.yaml INPUT_REVISION=specs/revision.yaml \
            INPUT_COMPOSED=false 'INPUT_ALLOW-EXTERNAL-REFS=false' INPUT_REVIEW=true \
            'INPUT_GITHUB-TOKEN=fake-token' bash ./breaking/entrypoint.sh

          if [ ! -f /tmp/run/comment.json ]; then
            echo "FAIL: no comment was posted" >&2
            exit 1
          fi
          body=$(jq -r '.body' < /tmp/run/comment.json)
          echo "--- comment body ---"
          echo "$body"
          for expected in \
            '6 API changes in this pull request' \
            '| severity | change | endpoint | diff |' \
            '<code>PUT /pets3</code> | [view](https://www.oasdiff.com/review/e/stub-id?highlight=fp3#k=stub-key) |' \
            '| error | ' \
            '| info | ' \
            '<details><summary>1 more</summary>' \
            'oasdiff Pro'
          do
            case "$body" in
              *"$expected"*) ;;
              *) echo "FAIL: the comment is missing: $expected" >&2; exit 1 ;;
            esac
          done
          # Spec text is attacker-controlled on a pull request: it must reach
          # the comment inert, with no live mention, link or HTML.
          case "$body" in
            *'@octocat'*|*'[l]('*|*'<b>'*) echo "FAIL: spec text reached the comment as live markdown" >&2; exit 1 ;;
          esac
          case "$body" in
            *'&#64;octocat'*) ;;
            *) echo "FAIL: the mention was dropped instead of neutralized" >&2; exit 1 ;;
          esac
          # Severest first, so the row that decides whether the pull request
          # can merge is never the one that collapses.
          first_row=$(printf '%s' "$body" | grep -m1 '^| \(error\|warning\|info\) ')
          case "$first_row" in
            '| error | '*) ;;
            *) echo "FAIL: the first row is not the error: $first_row" >&2; exit 1 ;;
          esac
          mode=$(jq -r '.props.mode' < /tmp/run/telemetry.json)
          if [ "$mode" != "comment" ]; then
            echo "FAIL: expected delivery mode 'comment', got '$mode'" >&2
            exit 1
          fi
          echo "PASS"

  oasdiff_changelog_fail_on:
    runs-on: ubuntu-latest
    name: Test changelog action fails the job on fail-on
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Running changelog action with fail-on
        id: test_fail_on
        continue-on-error: true
        uses: ./changelog
        with:
          base: 'specs/base.yaml'
          revision: 'specs/revision-breaking.yaml'
          fail-on: ERR
          review: false
      - name: Assert the step failed and still produced the changelog
        env:
          ACTUAL_OUTPUT: ${{ steps.test_fail_on.outputs.changelog }}
        run: |
          if [ "${{ steps.test_fail_on.outcome }}" != "failure" ]; then
            echo "Expected the step to fail on fail-on: ERR. Got: ${{ steps.test_fail_on.outcome }}" >&2
            exit 1
          fi
          case "$ACTUAL_OUTPUT" in
            *" changes: "*) ;;
            *) echo "Expected the changelog output alongside the failure, got: '$ACTUAL_OUTPUT'" >&2; exit 1 ;;
          esac

  oasdiff_changelog_yaml_config_fail_on:
    runs-on: ubuntu-latest
    name: Test changelog action picks up fail-on from .oasdiff.yaml
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: Drop .oasdiff.yaml at repo root
        run: |
          cat > .oasdiff.yaml <<EOF
          fail-on: ERR
          EOF
      - name: Running changelog action without a fail-on input
        id: test_yaml_fail_on
        continue-on-error: true
        uses: ./changelog
        with:
          base: 'specs/base.yaml'
          revision: 'specs/revision-breaking.yaml'
          review: false
      - name: Assert the fail-on in the file failed the step
        run: |
          if [ "${{ steps.test_yaml_fail_on.outcome }}" != "failure" ]; then
            echo "Expected the step to fail: .oasdiff.yaml sets fail-on: ERR. Got: ${{ steps.test_yaml_fail_on.outcome }}" >&2
            exit 1
          fi

  oasdiff_changelog_annotations:
    runs-on: ubuntu-latest
    name: Test changelog action annotates errors and warnings, not info
    # The changelog action writes the same inline annotations as breaking, for
    # the changes at error and warning level. Info changes are left out, since
    # a changelog can hold one per added property. Stubs oasdiff to emit one
    # annotation at each level.
    steps:
      - uses: actions/checkout@v7
      - name: Stub oasdiff, run entrypoint
        run: |
          set -euo pipefail
          mkdir -p /tmp/stub /tmp/run

          cat > /tmp/stub/oasdiff <<'STUB'
          #!/bin/sh
          for a in "$@"; do
            case "$a" in
              json) printf '[]'; exit 0 ;;
              githubactions)
                echo "::error title=an-error,file=openapi.yaml,line=3::in API GET /a broke"
                echo "::warning title=a-warning,file=openapi.yaml,line=4::in API GET /a may break"
                echo "::notice title=an-info,file=openapi.yaml,line=5::in API GET /a changed"
                # this format reports counts through GITHUB_OUTPUT
                echo "info_count=1" >> "$GITHUB_OUTPUT"
                exit 0 ;;
            esac
          done
          echo "3 changes: 1 error, 1 warning, 1 info"
          STUB
          chmod +x /tmp/stub/oasdiff

          export GITHUB_REF=refs/pull/123/merge
          export GITHUB_REPOSITORY=acme/widgets
          export GITHUB_OUTPUT=/tmp/run/out; : > "$GITHUB_OUTPUT"
          export GITHUB_STEP_SUMMARY=/tmp/run/summary; : > "$GITHUB_STEP_SUMMARY"
          export PATH=/tmp/stub:$PATH

          out=$(env OASDIFF_ACTION_COMMAND=changelog INPUT_BASE=b INPUT_REVISION=r INPUT_REVIEW=false \
            bash ./breaking/entrypoint.sh 2>&1)
          echo "$out"

          for expected in '::error title=an-error' '::warning title=a-warning'; do
            case "$out" in
              *"$expected"*) ;;
              *) echo "FAIL: missing annotation: $expected" >&2; exit 1 ;;
            esac
          done
          case "$out" in
            *'::notice title=an-info'*) echo "FAIL: an info change was annotated" >&2; exit 1 ;;
          esac
          if grep -q "info_count" "$GITHUB_OUTPUT"; then
            echo "FAIL: the annotation format's counts leaked into the action's outputs" >&2; exit 1
          fi
          echo "PASS"
